# XcodeGen spec — the single source of truth for the Xcode project.
# Regenerate the .xcodeproj after editing:  xcodegen generate
name: Budget
options:
  bundleIdPrefix: com.plainlysoftware
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - path: Budget
      # Icon Composer (.icon) bundle — added as an opaque file (type: file) so
      # XcodeGen doesn't recurse into it. Referenced by ASSETCATALOG_COMPILER_APPICON_NAME.
      - path: icon_1024.icon
        type: file
    settings:
      base:
        INFOPLIST_FILE: Budget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.plainlysoftware.pigglet
        ASSETCATALOG_COMPILER_APPICON_NAME: icon_1024
        # On-device signing (Apple Development team). Automatic signing lets Xcode
        # create/manage the provisioning profile when the phone is connected.
        DEVELOPMENT_TEAM: JC294S289S
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
