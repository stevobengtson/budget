[legal]
last_updated = "Dernière mise à jour le {{.Date}}"
contact_title = "Nous joindre"
contact_intro = "Vous avez une question, trouvé un bogue ou envie de nous dire ce qui manque ? Nous aimerions vous lire."
contact_email_heading = "Courriel"
contact_email_body = "La meilleure façon de nous joindre est par courriel à contact@plainlysoftware.com. Nous lisons chaque message et visons une réponse en deux jours ouvrables."
contact_who_heading = "Qui vous joignez"
contact_who_body = "Pigglet est conçu et exploité par Plainly Software, un studio logiciel indépendant au Canada. Il n'y a ni centre d'appels ni file de billets — seulement la petite équipe qui fait l'application."
privacy_title = "Politique de confidentialité"
privacy_intro = "Pigglet (« Pigglet », « nous ») est exploité par Plainly Software. La présente politique explique ce que nous recueillons, pourquoi, et les choix qui s'offrent à vous. En bref : nous recueillons le strict minimum, nous ne vendons jamais vos données et nous n'utilisons aucun témoin publicitaire ou de suivi."
privacy_collect_heading = "Renseignements que nous recueillons"
privacy_collect_account = "Renseignements de compte — l'adresse courriel et le mot de passe utilisés à l'inscription. Les mots de passe ne sont conservés que sous forme de hachage sécurisé, jamais en clair."
privacy_collect_budget = "Vos données budgétaires — les comptes, catégories, transactions et objectifs que vous saisissez. Elles vous appartiennent ; nous les utilisons uniquement pour vous fournir l'application."
privacy_collect_payment = "Renseignements de paiement — traités par notre processeur de paiement, Stripe. Nous ne voyons ni ne conservons jamais les détails complets de votre carte ; nous ne gardons qu'une référence client et l'état de votre abonnement."
privacy_collect_technical = "Données techniques minimales — des journaux de serveur de base (comme l'adresse IP et l'heure de la requête) nécessaires au fonctionnement sécuritaire du service."
privacy_dont_heading = "Ce que nous ne faisons pas"
privacy_dont_sell = "Nous ne vendons, ne louons ni n'échangeons vos renseignements personnels."
privacy_dont_share = "Nous ne partageons pas vos données avec des annonceurs et n'utilisons aucun témoin publicitaire ou de suivi tiers."
privacy_dont_ask = "Nous ne demandons pas de renseignements dont nous n'avons pas besoin — aucun numéro de téléphone, aucune adresse postale, aucune importation de courtiers en données."
privacy_cookies_heading = "Témoins"
privacy_cookies_body = "Nous n'utilisons que les témoins essentiels au fonctionnement de l'application : un témoin qui vous garde connecté et de petits témoins de préférences qui mémorisent votre disposition (par exemple, si une section est réduite). Nous n'utilisons aucun témoin publicitaire ou de suivi intersites."
privacy_providers_heading = "Fournisseurs de services"
privacy_providers_body = "Nous faisons appel à quelques fournisseurs de confiance pour exploiter Pigglet : Stripe traite les paiements et un fournisseur de courriel achemine les messages transactionnels comme les liens de vérification et de réinitialisation de mot de passe. Ces fournisseurs ne traitent que ce qui est nécessaire à leur fonction et n'ont pas le droit d'utiliser vos données à leurs propres fins."
privacy_retention_heading = "Conservation et suppression"
privacy_retention_body = "Nous conservons vos données tant que votre compte est actif. Si vous annulez et demandez la suppression de votre compte, nous retirons vos renseignements personnels et votre contenu budgétaire, sauf lorsque la loi nous oblige à conserver des registres de facturation limités. Pour demander la suppression, écrivez à contact@plainlysoftware.com."
privacy_security_heading = "Sécurité"
privacy_security_body = "Les données sont chiffrées en transit, les mots de passe sont hachés et votre budget n'est visible que par vous. Aucun système n'est parfaitement sûr, mais nous prenons des mesures raisonnables pour protéger vos renseignements."
privacy_rights_heading = "Vos droits"
privacy_rights_body = "Vous pouvez consulter, corriger ou supprimer vos renseignements à tout moment — la plupart directement dans l'application, et le reste en écrivant à contact@plainlysoftware.com. Selon votre lieu de résidence, vous pourriez avoir des droits additionnels en vertu des lois applicables sur la vie privée."
privacy_children_heading = "Enfants"
privacy_children_body = "Pigglet ne s'adresse pas aux enfants et n'est pas destiné aux personnes de moins de 16 ans. Nous ne recueillons pas sciemment de renseignements auprès d'enfants."
privacy_changes_heading = "Modifications à la présente politique"
privacy_changes_body = "Nous pouvons mettre à jour la présente politique de temps à autre. Lorsque nous apportons des changements importants, nous mettons à jour la date en haut de cette page. Des questions ? Écrivez à contact@plainlysoftware.com."
refund_title = "Politique de remboursement"
refund_intro = "Nous gardons la facturation simple et équitable : essayez Pigglet gratuitement pendant 35 jours, puis payez seulement si vous choisissez de continuer. Pour cette raison, nous n'offrons pas de remboursement."
refund_trial_heading = "Votre essai gratuit"
refund_trial_body = "Chaque compte commence par un essai gratuit de 35 jours. Aucune information de paiement n'est requise pour débuter et rien ne vous sera facturé pendant l'essai. C'est amplement de temps pour décider si Pigglet vous convient."
refund_billing_heading = "Facturation"
refund_billing_body = "Après l'essai, Pigglet coûte 4,99 $ CAD par mois. Les modules optionnels — certains gratuits, d'autres avec un léger supplément — sont facturés avec votre abonnement seulement si vous les activez. Les abonnements se renouvellent automatiquement chaque mois jusqu'à l'annulation."
refund_none_heading = "Aucun remboursement"
refund_none_body = "Puisque vous bénéficiez d'un essai gratuit complet de 35 jours avant tout prélèvement et que vous pouvez annuler à tout moment, tous les paiements sont non remboursables. À l'annulation, votre abonnement demeure actif jusqu'à la fin de la période de facturation en cours et n'est pas renouvelé — nous n'accordons pas de remboursement partiel ou au prorata pour le reste d'une période."
refund_cancel_heading = "Comment annuler"
refund_cancel_body = "Vous pouvez annuler à tout moment depuis la section Facturation de votre compte. L'annulation met fin aux prélèvements futurs ; vous conservez l'accès jusqu'à la fin de la période déjà payée."
refund_exceptions_heading = "Exceptions"
refund_exceptions_body = "Rien dans la présente politique ne limite les droits dont vous pourriez disposer en vertu des lois applicables sur la protection du consommateur. Si vous croyez avoir été facturé par erreur, écrivez à contact@plainlysoftware.com et nous corrigerons la situation."
terms_title = "Conditions générales"
terms_intro = "Les présentes conditions générales (« Conditions ») régissent votre utilisation de Pigglet, exploité par Plainly Software (« nous »). En créant un compte ou en utilisant l'application, vous acceptez ces Conditions."
terms_service_heading = "Le service"
terms_service_body = "Pigglet est une application de budget personnel. Nous pouvons ajouter, modifier ou retirer des fonctionnalités au fil du temps à mesure que nous améliorons le produit."
terms_account_heading = "Votre compte"
terms_account_body = "Vous devez fournir des renseignements exacts à l'inscription et protéger votre mot de passe. Vous êtes responsable de l'activité effectuée sous votre compte. Avisez-nous rapidement si vous croyez que votre compte a été compromis."
terms_billing_heading = "Abonnements, essais et facturation"
terms_billing_body = "Pigglet comprend un essai gratuit de 35 jours sans information de paiement. Après l'essai, le service coûte 4,99 $ CAD par mois, plus les modules optionnels que vous activez. Les abonnements se renouvellent automatiquement jusqu'à l'annulation. Les paiements sont non remboursables, comme le décrit notre Politique de remboursement. Vous pouvez annuler à tout moment depuis votre compte."
terms_use_heading = "Utilisation acceptable"
terms_use_body = "N'utilisez Pigglet qu'à des fins licites. N'essayez pas de perturber le service ou d'y accéder sans autorisation, de le rétroconcevoir, de le revendre, ni de l'utiliser pour stocker ou transmettre du contenu illicite."
terms_data_heading = "Vos données"
terms_data_body = "Vos données budgétaires vous appartiennent. Nous n'en revendiquons aucune propriété et ne les utilisons que pour fournir l'application, comme le décrit notre Politique de confidentialité. Le logiciel, le design et la marque Pigglet demeurent la propriété de Plainly Software."
terms_advice_heading = "Pas un conseil financier"
terms_advice_body = "Pigglet est un outil pour vous aider à organiser votre propre argent. Il ne fournit aucun conseil financier, en placement, fiscal ou juridique, et rien dans l'application ne doit être considéré comme tel. Les décisions que vous prenez avec l'outil vous appartiennent."
terms_liability_heading = "Avis de non-responsabilité et limitation de responsabilité"
terms_liability_body = "Le service est fourni « tel quel » et « selon la disponibilité », sans garantie d'aucune sorte. Dans toute la mesure permise par la loi, Plainly Software n'est pas responsable des dommages indirects, accessoires ou consécutifs, ni de toute perte de données ou de profits découlant de votre utilisation de Pigglet."
terms_termination_heading = "Résiliation"
terms_termination_body = "Vous pouvez cesser d'utiliser Pigglet et supprimer votre compte à tout moment. Nous pouvons suspendre ou résilier l'accès en cas de violation des présentes Conditions ou si cela est nécessaire pour protéger le service ou les autres utilisateurs."
terms_law_heading = "Droit applicable"
terms_law_body = "Les présentes Conditions sont régies par les lois du Canada et de la province où Plainly Software exerce ses activités, sans égard aux principes de conflit de lois."
terms_changes_heading = "Modifications aux présentes Conditions"
terms_changes_body = "Nous pouvons mettre à jour les présentes Conditions de temps à autre. Lorsque nous apportons des changements importants, nous mettons à jour la date en haut de cette page. L'utilisation continue de Pigglet après un changement signifie que vous acceptez les Conditions mises à jour. Des questions ? Écrivez à contact@plainlysoftware.com."

