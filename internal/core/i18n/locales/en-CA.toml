# Canadian English — the source catalog.
#
# Every message the app can render is defined here first; fr-CA.toml mirrors the
# same keys. A key missing from a translation falls back to this file, so this
# one must stay complete.
#
# Keys are grouped by area. Nested tables become dotted message IDs, so
# [nav] budget = "Budget" is the message "nav.budget".
#
# Interpolation uses Go template syntax: "{{.Name}}". Pluralized messages use
# one/other sub-keys and read the count as "{{.Count}}".

