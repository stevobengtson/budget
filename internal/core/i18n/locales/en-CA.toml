privacy_intro = "Pigglet (\"Pigglet\", \"we\", \"us\") is operated by Plainly Software. This policy explains what we collect, why, and the choices you have. The short version: we collect as little as possible, we never sell your data, and we don't run ad or tracking cookies."
privacy_collect_heading = "Information we collect"
privacy_collect_account = "Account information — the email address and password you sign up with. Passwords are stored only as a secure hash, never in plain text."
privacy_collect_budget = "Your budget data — the accounts, categories, transactions and goals you enter. This is yours; we use it only to provide the app to you."
privacy_collect_payment = "Payment information — handled by our payment processor, Stripe. We never see or store your full card details; we keep only a customer reference and your subscription status."
privacy_collect_technical = "Minimal technical data — basic server logs (such as IP address and request time) needed to keep the service running securely."
privacy_dont_heading = "What we don't do"
privacy_dont_sell = "We do not sell, rent, or trade your personal information."
privacy_dont_share = "We do not share your data with advertisers, and we run no advertising or third-party tracking cookies."
privacy_dont_ask = "We do not ask for information we don't need — no phone number, no mailing address, no data-broker imports."
privacy_cookies_heading = "Cookies"
privacy_cookies_body = "We use only essential cookies required to run the app: a cookie that keeps you signed in, and small preference cookies that remember your layout (for example, whether a section is collapsed). We do not use advertising or cross-site tracking cookies of any kind."
privacy_providers_heading = "Service providers"
privacy_providers_body = "We rely on a few trusted providers to operate Pigglet: Stripe processes payments, and an email provider delivers transactional messages such as verification and password-reset links. These providers process only what's needed to perform their function and are not permitted to use your data for their own purposes."
privacy_retention_heading = "Retention and deletion"
privacy_retention_body = "We keep your data for as long as your account is active. If you cancel and ask us to delete your account, we remove your personal data and budget content, except where we're required to retain limited billing records by law. To request deletion, email contact@plainlysoftware.com."
privacy_security_heading = "Security"
privacy_security_body = "Data is encrypted in transit, passwords are hashed, and your budget is only ever visible to you. No system is perfectly secure, but we take reasonable measures to protect your information."
privacy_rights_heading = "Your rights"
privacy_rights_body = "You can access, correct, or delete your information at any time — most of it directly in the app, and the rest by emailing contact@plainlysoftware.com. Depending on where you live, you may have additional rights under applicable privacy law."
privacy_children_heading = "Children"
privacy_children_body = "Pigglet is not directed at children and is not intended for anyone under 16. We do not knowingly collect information from children."
privacy_changes_heading = "Changes to this policy"
privacy_changes_body = "We may update this policy from time to time. When we make material changes, we'll update the date at the top of this page. Questions? Email contact@plainlysoftware.com."
refund_title = "Refund Policy"
refund_intro = "We keep billing simple and fair: try Pigglet free for 35 days, then pay only if you choose to continue. Because of that, we don't offer refunds."
refund_trial_heading = "Your free trial"
refund_trial_body = "Every account starts with a 35-day free trial. No payment information is required to begin, and you won't be charged anything during the trial. It's plenty of time to decide whether Pigglet is right for you."
refund_billing_heading = "Billing"
refund_billing_body = "After the trial, Pigglet is $4.99 CAD per month. Optional add-ons — some free, some a small additional charge — are billed alongside your subscription only if you enable them. Subscriptions renew automatically each month until you cancel."
refund_none_heading = "No refunds"
refund_none_body = "Because you get a full 35-day free trial before any charge, and because you can cancel at any time, all payments are non-refundable. When you cancel, your subscription stays active until the end of the current billing period and is not renewed — we don't issue partial or prorated refunds for the remainder of a period."
refund_cancel_heading = "How to cancel"
refund_cancel_body = "You can cancel anytime from the Billing section of your account. Cancelling stops future charges; you keep access until the end of the period you've already paid for."
refund_exceptions_heading = "Exceptions"
refund_exceptions_body = "Nothing in this policy limits any rights you may have under applicable consumer-protection law. If you believe you were charged in error, email contact@plainlysoftware.com and we'll make it right."
terms_title = "Terms & Conditions"
terms_intro = "These Terms & Conditions (\"Terms\") govern your use of Pigglet, operated by Plainly Software (\"we\", \"us\"). By creating an account or using the app, you agree to these Terms."
terms_service_heading = "The service"
terms_service_body = "Pigglet is a personal budgeting application. We may add, change, or remove features over time as we improve the product."
terms_account_heading = "Your account"
terms_account_body = "You must provide accurate information when you sign up and keep your password secure. You're responsible for activity that happens under your account. Let us know promptly if you believe your account has been compromised."
terms_billing_heading = "Subscriptions, trials, and billing"
terms_billing_body = "Pigglet includes a 35-day free trial with no payment information required. After the trial, the service is $4.99 CAD per month, plus any optional add-ons you enable. Subscriptions renew automatically until cancelled. Payments are non-refundable, as described in our Refund Policy. You can cancel anytime from your account."
terms_use_heading = "Acceptable use"
terms_use_body = "Use Pigglet only for lawful purposes. Don't attempt to disrupt or gain unauthorized access to the service, reverse-engineer it, resell it, or use it to store or transmit unlawful content."
terms_data_heading = "Your data"
terms_data_body = "Your budget data belongs to you. We claim no ownership of it and use it only to provide the app, as described in our Privacy Policy. The Pigglet software, design, and brand remain the property of Plainly Software."
terms_advice_heading = "Not financial advice"
terms_advice_body = "Pigglet is a tool to help you organize your own money. It does not provide financial, investment, tax, or legal advice, and nothing in the app should be treated as such. Decisions you make with it are your own."
terms_liability_heading = "Disclaimers and limitation of liability"
terms_liability_body = "The service is provided \"as is\" and \"as available\", without warranties of any kind. To the fullest extent permitted by law, Plainly Software is not liable for any indirect, incidental, or consequential damages, or for any loss of data or profits, arising from your use of Pigglet."
terms_termination_heading = "Termination"
terms_termination_body = "You may stop using Pigglet and delete your account at any time. We may suspend or terminate access if these Terms are violated or if required to protect the service or other users."
terms_law_heading = "Governing law"
terms_law_body = "These Terms are governed by the laws of Canada and the province in which Plainly Software operates, without regard to conflict-of-law principles."
terms_changes_heading = "Changes to these Terms"
terms_changes_body = "We may update these Terms from time to time. When we make material changes, we'll update the date at the top of this page. Continued use of Pigglet after a change means you accept the updated Terms. Questions? Email contact@plainlysoftware.com."
