# Task runner — https://taskfile.dev. Replaces the old Makefile.
# Inside `devbox shell`, TAILWIND/TEMPL are exported to the nix binaries, so the
# tailwind download + `go install` steps below are skipped automatically.
version: "3"

vars:
  BIN_WEB: ./bin/web/budget
  CMD_WEB: ./cmd/web
  MIGRATIONS: ./internal/core/db/migrations/postgres
  # Postgres DSN for the goose admin targets. Override with BUDGET_DB_DSN.
  DEFAULT_DSN: "postgres://postgres:postgres@127.0.0.1:5432/budget?sslmode=disable"

  # Overridden by devbox env (nix paths); default to bundled/PATH binaries.
  TEMPL: '{{.TEMPL | default "templ"}}'
  TAILWIND: '{{.TAILWIND | default "./bin/tailwindcss"}}'

  CSS_SRC: ./internal/web/tailwind/input.css
  CSS_OUT: ./internal/web/static/app.css
  # Generated @source lines pointing at templUI in the Go module cache.
  CSS_SOURCES: ./internal/web/tailwind/templui-sources.css

  # Tailwind v4 standalone CLI (only used when TAILWIND is the bundled binary).
  TAILWIND_VERSION: v4.3.0
  TAILWIND_OS: '{{if eq OS "darwin"}}macos{{else}}linux{{end}}'
  TAILWIND_ARCH: '{{if eq ARCH "arm64"}}arm64{{else}}x64{{end}}'
  TAILWIND_ASSET: "tailwindcss-{{.TAILWIND_OS}}-{{.TAILWIND_ARCH}}"
  TAILWIND_URL: "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/{{.TAILWIND_ASSET}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install Go deps + goose; ensure templ + tailwind CLIs present
    deps: [tools]
    cmds:
      - cmd: 'command -v go >/dev/null 2>&1 || { echo "ERROR: go not found — install from https://go.dev/dl/"; exit 1; }'
        silent: true
      - go mod download
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - cmd: 'echo "Setup complete. Run ''task run'' for the TUI or ''task web'' to serve HTTP."'
        silent: true

  tools:
    desc: Ensure templ + tailwind CLIs are available
    deps: [tailwind-cli]
    cmds:
      - cmd: command -v {{.TEMPL}} >/dev/null 2>&1 || go install github.com/a-h/templ/cmd/templ@latest
        silent: true

  # Downloads the standalone tailwind binary only when TAILWIND points at a
  # missing file (mirrors the Makefile file-target). Skipped when TAILWIND is a
  # nix/PATH binary that already exists.
  #
  # Presence is all this checks, deliberately: whether the binary actually runs
  # is scripts/tailwind-runnable.sh's problem, and it can fix a binary that does
  # not, which re-downloading the same broken artifact cannot.
  tailwind-cli:
    internal: true
    status:
      - test -f "{{.TAILWIND}}" || command -v "{{.TAILWIND}}" >/dev/null 2>&1
    cmds:
      - mkdir -p "$(dirname "{{.TAILWIND}}")"
      - echo "→ downloading {{.TAILWIND_URL}}"
      - curl -fsSL -o "{{.TAILWIND}}" "{{.TAILWIND_URL}}"
      - chmod +x "{{.TAILWIND}}"

  templ:
    desc: Generate Go from .templ files
    deps: [tools]
    cmds:
      - "{{.TEMPL}} generate -path ./internal/web"

  # templUI's components ship in the Go module cache, and Tailwind only emits
  # utilities it can see in a scanned file, so that directory has to be an
  # @source. Its path depends on GOMODCACHE and the module version, neither of
  # which a checked-in relative path can know — `go list -m` does. Generated,
  # gitignored, and imported by input.css; a stale or missing file fails the
  # build loudly rather than silently shipping a css without the component
  # utilities in it.
  css-sources:
    internal: true
    vars:
      TEMPLUI_DIR:
        sh: go list -m -f '{{`{{.Dir}}`}}' github.com/templui/templui
    cmds:
      # Rewritten only when the content actually changes: every build runs this,
      # and an unconditional write is a file modification that file watchers
      # (air, tailwind --watch) see as a source edit and rebuild for — which
      # rebuilds, which writes, forever.
      - |
        tmp="$(mktemp)"
        {
          printf '/* GENERATED by `task css-sources` — do not edit, do not commit. */\n'
          printf '@source "%s/components/**/*.templ";\n' '{{.TEMPLUI_DIR}}'
          printf '@source "%s/components/**/*_templ.go";\n' '{{.TEMPLUI_DIR}}'
        } > "$tmp"
        cmp -s "$tmp" {{.CSS_SOURCES}} && rm -f "$tmp" || mv "$tmp" {{.CSS_SOURCES}}

  # TAILWIND goes through tailwind-runnable.sh rather than being invoked
  # directly: the standalone CLI is Bun-compiled, and a Bun bug leaves the
  # Mach-O signature truncated, which macOS 27 turns into a SIGKILL at exec
  # (exit 137 on every run, including --help). The script hands back a re-signed
  # copy. Resolved here in a command substitution, not a task var, so it runs
  # after the tailwind-cli dep has had its chance to download the CLI.
  css:
    desc: Compile Tailwind CSS
    deps: [tailwind-cli, css-sources]
    cmds:
      - '"$(./scripts/tailwind-runnable.sh "{{.TAILWIND}}")" -i {{.CSS_SRC}} -o {{.CSS_OUT}} --minify'

  tailwind:
    desc: Alias for css
    deps: [css]

  tailwind-watch:
    desc: Watch + recompile Tailwind CSS
    deps: [tailwind-cli, css-sources]
    cmds:
      - '"$(./scripts/tailwind-runnable.sh "{{.TAILWIND}}")" -i {{.CSS_SRC}} -o {{.CSS_OUT}} --watch'

  build:
    desc: Build the web binary (regenerates css + templ first)
    deps: [css, templ]
    cmds:
      - go build -o {{.BIN_WEB}} {{.CMD_WEB}}

  run:
    desc: Build + launch the web server
    deps: [build:web]
    cmds:
      - "{{.BIN_WEB}}"

  web:
    desc: Alias for run
    deps: [run]

  dev:
    desc: Hot-reload web server via air
    cmds:
      - air

  test:
    desc: templ generate + go test ./...
    deps: [templ]
    cmds:
      - go test ./...

  clean:
    desc: Remove built binaries + compiled CSS
    cmds:
      - rm -rf ./bin/tui ./bin/web {{.CSS_OUT}}

  db:dsn:
    desc: Print the Postgres DSN the admin targets use (BUDGET_DB_DSN or default)
    cmds:
      - 'echo "${BUDGET_DB_DSN:-{{.DEFAULT_DSN}}}"'
    silent: true

  db:migrate:
    desc: Run goose migrations up against Postgres
    cmds:
      - 'goose -dir {{.MIGRATIONS}} postgres "${BUDGET_DB_DSN:-{{.DEFAULT_DSN}}}" up'

  db:reset:
    # Migrate first so the schema is at head, then empty it. This does NOT roll
    # migrations back: `goose reset` would exercise every Down migration just to
    # throw away rows, and a single bad Down leaves the schema stranded. TRUNCATE
    # of all tables at once (RESTART IDENTITY CASCADE) empties them regardless of
    # the foreign keys between them, and keeps goose_db_version intact.
    desc: Migrate, then truncate every table (DESTRUCTIVE — wipes data, keeps schema)
    deps: [build]
    cmds:
      - task: db:migrate
      - '{{.BIN_WEB}} --db "${BUDGET_DB_DSN:-{{.DEFAULT_DSN}}}" db truncate'

  db:status:
    desc: Show goose migration status
    cmds:
      - 'goose -dir {{.MIGRATIONS}} postgres "${BUDGET_DB_DSN:-{{.DEFAULT_DSN}}}" status'

  db:seed:
    desc: Migrate + load demo data via the web binary
    deps: [build]
    cmds:
      - task: db:migrate
      - '{{.BIN_WEB}} --db "${BUDGET_DB_DSN:-{{.DEFAULT_DSN}}}" db seed'
