#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./bin/web/budget"
cmd = "task css && ${TEMPL:-templ} generate -path ./internal/web && go build -o ./bin/web/budget ./cmd/web"
delay = 1000
entrypoint = ["./bin/web/budget"]
exclude_dir = [
  "assets",
  "data",
  "docs",
  "mobile",
  "screenshots",
  "testdata",
  "tmp",
  "vendor",
]
exclude_file = []
# app.css and templui-sources.css are both written by the build command itself;
# without them here, each build's own output retriggers the watcher forever.
exclude_regex = ["_test.go", ".*_templ.go", "app.css", "templui-sources.css"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_dir = []
# png and woff2 are here because internal/web/static is compiled into the binary
# (//go:embed static), so changing one needs a Go rebuild like any source file.
# Without them a replaced image or font kept serving the previously built bytes
# and looked like the edit had not landed — and the ?v= cache-buster cannot help,
# since it is hashed from the same stale embedded FS at startup.
include_ext = ["go", "tpl", "tmpl", "html", "templ", "css", "js", "svg", "png", "woff2"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
